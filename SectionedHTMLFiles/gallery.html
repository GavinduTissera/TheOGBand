<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <title>Document</title>
</head>
<body>
    <!--GALLERY SECTION-->
    <section class="GallerySection">
        <!--Header for gallery section-->
        <h3 class="header">GALLERY</h3>
        <!--Left and right buttons-->
        <button onclick="DecrementCounter()" class="prev -button" id="prev-button">&#10229;</button>
        <button onclick="IncrementCounter()" class="next -button" id="next-button">&#10230;</button>
        <!--Carousel-->
        <div class="carousel">
            <div class="radioandslides">
                <!--Radio Buttons-->
                <input type="radio" name="radioselectors" id="radio1">
                <input type="radio" name="radioselectors" id="radio2">
                <input type="radio" name="radioselectors" id="radio3">
                <input type="radio" name="radioselectors" id="radio4">
                <input type="radio" name="radioselectors" id="radio5">
                <!--Pictures in the gallery-->
                <div class="slide first">
                    <img src="Images/BestBandPictures/basscloseup.png" alt="">
                </div>
                <div class="slide">
                    <img src="Images/BestBandPictures/fullband.png" alt="">
                </div>
                <div class="slide">
                    <img src="Images/BestBandPictures/fullbandotherside.png" alt="">
                </div>
                <div class="slide">
                    <img src="Images/BestBandPictures/jasvirdrums2.png" alt="">
                </div>
                <div class="slide">
                    <img src="Images/BestBandPictures/singers2.png" alt="">
                </div>
                <!--Auto Navigation-->
                <div class="AutoNavigation">
                    <div class="Autobtn1"></div>
                    <div class="Autobtn2"></div>
                    <div class="Autobtn3"></div>
                    <div class="Autobtn4"></div>
                    <div class="Autobtn5"></div>
                </div>
                </div>
                <!--Manual Navigation-->
            <div class="ManualNavigation">
                <label for="radio1" class="Manualbtn"></label>
                <label for="radio2" class="Manualbtn"></label>
                <label for="radio3" class="Manualbtn"></label>
                <label for="radio4" class="Manualbtn"></label>
                <label for="radio5" class="Manualbtn"></label>
            </div>
        </div>
  
        <!--Script that does that auto navigation-->
        <script type="text/javascript">
        var counter = 1;
        setInterval( function(){
            document.getElementById("radio" + counter).checked = true;
            counter++;
            if(counter > 5){
                counter = 1;
            }
        }, 5000)

        //When the left arrow is pressed in the gallery, it moves the counter to the previous image
        function DecrementCounter() {
            //If the counter is 1, it wraps to the last image
            if (counter == 1) {
                counter = 5
            } else {
                counter--;
            }
            clearInterval()
            document.getElementById("radio" + counter).checked = true;
        }
        
        //When the right arrow is pressed in the gallery, it moves the counter to the next image
        function IncrementCounter() {
            //If the counter is 5, it wraps to the first image
            if (counter == 5) {
                counter = 1
            } else {
                counter++;
            }
            document.getElementById("radio" + counter).checked = true;
        }

        </script>
    </section>
</body>
</html>
